<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Player</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; background: #000; }
    video { width: 100%; height: 100%; object-fit: contain; display: block; }
    #scrubber {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 5;
      padding: 0.5rem 1rem;
      opacity: 0;
      transition: opacity 0.3s;
    }
    #scrubber.visible { opacity: 1; }
    #scrubber input {
      width: 100%;
      cursor: pointer;
      accent-color: #444;
      filter: brightness(0.6);
    }
    #settings-btn {
      position: fixed;
      top: 1rem;
      right: 1rem;
      z-index: 10;
      opacity: 0;
      transition: opacity 0.3s;
    }
    #settings-btn.visible { opacity: 0.6; }
    #settings-btn.visible:hover { opacity: 1; }
    #settings-panel {
      position: fixed;
      top: 0;
      right: -280px;
      width: 280px;
      height: 100%;
      background: rgba(33, 37, 41, 0.95);
      z-index: 20;
      transition: right 0.25s ease;
      padding: 3.5rem 1.5rem 1.5rem;
    }
    #settings-panel.open { right: 0; }
    #settings-panel label { color: #ccc; }
  </style>
</head>
<body>
  <video id="player" src="./video.mp4" muted loop autoplay></video>

  <div id="scrubber">
    <input type="range" id="seek" min="0" max="1000" value="0" step="1">
  </div>

  <button id="settings-btn" class="btn btn-dark btn-sm" aria-label="Settings">⚙</button>

  <div id="settings-panel">
    <h6 class="text-light mb-4">Settings</h6>

    <div class="mb-3">
      <label class="form-label">Playback Speed</label>
      <select id="speed" class="form-select form-select-sm">
        <option value="0.5">0.5x</option>
        <option value="1" selected>1x</option>
        <option value="1.5">1.5x</option>
        <option value="2">2x</option>
      </select>
    </div>

    <div class="form-check form-switch mb-3">
      <input class="form-check-input" type="checkbox" id="loop-toggle" checked>
      <label class="form-check-label" for="loop-toggle">Loop</label>
    </div>

    <div class="form-check form-switch mb-3">
      <input class="form-check-input" type="checkbox" id="mute-toggle" checked>
      <label class="form-check-label" for="mute-toggle">Mute</label>
    </div>
  </div>

  <script>
    const player = document.getElementById('player');
    const panel = document.getElementById('settings-panel');
    const scrubber = document.getElementById('scrubber');
    const seek = document.getElementById('seek');
    const settingsBtn = document.getElementById('settings-btn');
    let hideTimeout;

    function showUI() {
      scrubber.classList.add('visible');
      settingsBtn.classList.add('visible');
      clearTimeout(hideTimeout);
      hideTimeout = setTimeout(() => {
        scrubber.classList.remove('visible');
        settingsBtn.classList.remove('visible');
      }, 2000);
    }

    document.addEventListener('mousemove', showUI);
    showUI();

    // Scrubber sync
    let seeking = false;
    player.addEventListener('timeupdate', () => {
      if (!seeking && player.duration) {
        seek.value = (player.currentTime / player.duration) * 1000;
      }
    });
    seek.addEventListener('input', () => {
      seeking = true;
      player.currentTime = (seek.value / 1000) * player.duration;
    });
    seek.addEventListener('change', () => { seeking = false; });

    settingsBtn.onclick = () => panel.classList.toggle('open');
    document.getElementById('speed').onchange = e => player.playbackRate = parseFloat(e.target.value);
    document.getElementById('loop-toggle').onchange = e => player.loop = e.target.checked;
    document.getElementById('mute-toggle').onchange = e => player.muted = e.target.checked;

    document.addEventListener('keydown', e => {
      if (e.code === 'Space') {
        e.preventDefault();
        player.paused ? player.play() : player.pause();
      }
    });

    document.addEventListener('click', e => {
      if (!panel.contains(e.target) && e.target.id !== 'settings-btn') {
        panel.classList.remove('open');
      }
    });
  </script>
</body>
</html>
